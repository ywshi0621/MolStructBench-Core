[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "molstructbench-core"
version = "1.0.0"
description = "Molecular structure understanding and grounding benchmark with local automatic scoring"
requires-python = ">=3.10,<3.12"
dependencies = ["PyYAML==6.0.2", "numpy==1.26.4", "rdkit==2024.3.5"]
[project.scripts]
molstructbench = "scibench.cli:main"
scibench = "scibench.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["scibench*", "evaluator*", "tests*", "scripts*", "benchmark_core*"]
