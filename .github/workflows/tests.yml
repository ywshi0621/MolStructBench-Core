name: Local benchmark checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/gold_selftest.py
      - run: python scripts/reproduce_history.py --output results/history
